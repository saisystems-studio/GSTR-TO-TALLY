# Existing /gstr2tally deployment. Connector traffic is ordinary HTTPS polling;
# no WebSocket upgrade and no public Tally listener are required.
location /gstr2tally/ {
    try_files $uri $uri/ /gstr2tally/index.html;
}
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
# Do not add a proxy_pass for 127.0.0.1:9000. The only Tally endpoint is local
# to the Windows connector process.
